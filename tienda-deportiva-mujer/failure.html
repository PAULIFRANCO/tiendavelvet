<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago no procesado — VELVET</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    background: #14121a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 0;
    padding: 24px;
  }
  .box { max-width: 420px; }
  .icon { font-size: 3.5rem; margin-bottom: 20px; }
  h1 { font-size: 1.8rem; margin-bottom: 12px; }
  p { color: #c9c5d0; margin-bottom: 28px; line-height: 1.6; }
  a {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 100px;
    background: linear-gradient(135deg, #ff3d7f, #ff7a5c);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">⚠️</div>
    <h1>No pudimos procesar el pago</h1>
    <p>Tu compra no se completó. Tu carrito sigue guardado, podés intentar de nuevo o usar otro medio de pago.</p>
    <a href="/index.html">Volver a la tienda</a>
  </div>
</body>
</html>
