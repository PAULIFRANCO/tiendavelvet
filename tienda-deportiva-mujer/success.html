<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compra exitosa — VELVET</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    background: #565264;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 0;
    padding: 24px;
  }
  .box { max-width: 420px; }
  .icon { font-size: 3.5rem; margin-bottom: 20px; }
  h1 { font-size: 1.8rem; margin-bottom: 12px; }
  p { color: #c9c5d0; margin-bottom: 28px; line-height: 1.6; }
  a {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 2px;
    background: #fff;
    color: #565264;
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-size: 0.85rem;
    transition: background 0.25s ease;
  }
  a:hover { background: #e6e2db; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>¡Gracias por tu compra!</h1>
    <p>Tu pago fue aprobado. Te enviaremos la confirmación por correo y en breve procesamos tu pedido.</p>
    <a href="/index.html">Volver a la tienda</a>
  </div>
  <script type="module" src="success.js"></script>
</body>
</html>
